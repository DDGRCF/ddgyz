[mgr]
ratio = [1, 4, 3]
sort_by = "extension"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "btime"
show_hidden = true
show_symlink = true

[preview]
wrap = "yes"
image_filter = "lanczos3"


[plugin]
prepend_preloaders = [
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { url = "/run/user/1000/gvfs/**/*", run = "noop" },
  { url = "/run/media/*/**/*", run = "noop" },
  { url = "*.typ", run = "preview-typst" },
]
prepend_previewers = [
  # Markdown 预览首选：glow 渲染（需要 glow 命令；未安装时插件自动回退为纯文本）
  { url = "*.md", run = "glow-md" },
  { url = "*.markdown", run = "glow-md" },
  { url = "*.mdown", run = "glow-md" },
  { url = "*.mkd", run = "glow-md" },
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
  { mime = "application/postscript", run = "mediainfo" },
  { url = "*/", run = "folder" },
  { url = "/run/user/1000/gvfs/**/*", run = "noop" },
  { url = "/run/media/*/**/*", run = "noop" },
  { url = "*.csv", run = "duckdb" },
  { url = "*.tsv", run = "duckdb" },
  { url = "*.json", run = "duckdb" },
  { url = "*.parquet", run = "duckdb" },
  { url = "*.xlsx", run = "duckdb" },
  { url = "*.db", run = "duckdb" },
  { url = "*.duckdb", run = "duckdb" },
  { url = "*.docx", run = "docx-preview" },
  { url = "*.typ", run = "preview-typst" },
]
[tasks]
image_alloc = 1073741824 # = 1024*1024*1024 = 1024MB

# ==================== 打开方式 ====================
[open]
# HTML 直接用默认浏览器打开（Yazi 默认会把 text/* 交给 $EDITOR）
# 视频 / 图片：Linux 优先 mpv / feh，没装就自动退回系统默认；macOS 用 open（系统默认）
prepend_rules = [
  { mime = "video/*", use = [ "video", "play" ] },
  { mime = "image/*", use = [ "image", "play" ] },
  { mime = "text/html", use = "open" },
  { url = "*.html", use = "open" },
  { url = "*.htm", use = "open" },
  { url = "*.xhtml", use = "open" },
]

[opener]
# 注意：Yazi 不会自己检测命令是否存在，所以「找不到就退回 xdg-open」
# 写在 shell 里（command -v 判断 + exec），这样不会弹出 Failed to spawn。
video = [
  { run = 'if command -v mpv >/dev/null 2>&1; then exec mpv %s; else exec xdg-open %s1; fi', desc = "mpv（未安装时用系统默认）", for = "linux" },
  { run = "open %s", desc = "系统默认播放器", for = "macos" },
]
image = [
  { run = 'if command -v feh >/dev/null 2>&1; then exec feh %s; else exec xdg-open %s1; fi', desc = "feh（未安装时用系统默认）", for = "linux" },
  { run = "open %s", desc = "系统默认看图", for = "macos" },
]
